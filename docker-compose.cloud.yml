# ==============================================================================
# ESCENARIO CLOUD (Railway / AWS EC2): WM_Central + Base de Datos SQLite + Kafka
# Uso:
#   export IP_PUBLICA_CLOUD=<TU_IP_PUBLICA_AWS_O_HOST>
#   docker compose -f docker-compose.cloud.yml up -d --build
# ==============================================================================
services:
  broker:
    image: bitnamilegacy/kafka:3.7.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx350M -Xms350M"
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@broker:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://${IP_PUBLICA_CLOUD:-localhost}:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  central:
    image: wm-central:latest
    build:
      context: .
      dockerfile: Dockerfile.central
    container_name: wm_central
    ports:
      - "8080:8080" # Sockets TCP para Monitores WM_WS_M
      - "8081:8081" # Dashboard Web en tiempo real
    environment:
      PUERTO_CENTRAL: 8080
      IP_KAFKA: broker
      PUERTO_KAFKA: 29092
    volumes:
      - ./watermanagement.db:/app/watermanagement.db
    depends_on:
      - broker
    restart: unless-stopped
