  # ==========================================
  # FIELD OPERATOR (Operario de Campo interactivo)
  # Lanzar con: docker compose run --rm fo
  # ==========================================
  fo:
    image: wm-fo:latest
    build:
      context: .
      dockerfile: Dockerfile.fo
    container_name: wm_fo
    stdin_open: true
    tty: true
    profiles:
      - manual
    environment:
      IP_KAFKA: broker
      PUERTO_KAFKA: 29092
      ID_FO: FO_01
      IP_CENTRAL: central
      PUERTO_CENTRAL: 8080
    depends_on:
      - central
      - broker
