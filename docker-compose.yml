services:
  # ==========================================
  # BROKER APACHE KAFKA (KRaft mode)
  # ==========================================
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "gTBb85_WRXu6oQgq-brTQw"

  # ==========================================
  # CENTRAL DE GESTIÓN (WM_Central + Web Dashboard)
  # ==========================================
  central:
    image: wm-central:latest
    build:
      context: .
      dockerfile: Dockerfile.central
    container_name: wm_central
    ports:
      - "8080:8080" # Sockets TCP para Monitores y Field Operator
      - "8081:8081" # Dashboard Web interactivo y mapa
    environment:
      PUERTO_CENTRAL: 8080
      IP_KAFKA: broker
      PUERTO_KAFKA: 29092
    depends_on:
      - broker
    restart: unless-stopped

  # ==========================================
  # ESTACIÓN WS_01: Parque Central - Norte
  # ==========================================
  ws01_monitor:
    image: wm-monitor:latest
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: ws01_monitor
    environment:
      PUERTO_ENGINE: 5001
      IP_CENTRAL: central
      PUERTO_CENTRAL: 8080
      ID_WS: WS_01
      UBICACION: "Parque Central - Norte"
    depends_on:
      - central
    restart: unless-stopped

  ws01_engine:
    image: wm-engine:latest
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: ws01_engine
    stdin_open: true
    tty: true
    environment:
      IP_KAFKA: broker
      PUERTO_KAFKA: 29092
      IP_MONITOR: ws01_monitor
      PUERTO_MONITOR: 5001
      ID_WS: WS_01
    depends_on:
      - broker
      - ws01_monitor
    restart: unless-stopped

  # ==========================================
  # ESTACIÓN WS_02: Parque Central - Sur
